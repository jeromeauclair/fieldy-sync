name: Release

# Pushing a tag that matches the manifest version (e.g. 1.0.0, no "v" prefix)
# builds the plugin and creates a draft GitHub release with the assets
# Obsidian downloads: main.js, manifest.json and styles.css.
on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Check, test and build
        run: npm run check
      - name: Verify tag matches manifest version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="$(node -p "require('./manifest.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag $tag does not match manifest.json version $version" >&2
            exit 1
          fi
      - name: Release notes from this version's changelog section
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          awk -v heading="## $tag" '$0 == heading { found = 1; next } found && /^## / { exit } found { print }' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no \"## $tag\" section" >&2
            exit 1
          fi
      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" --title "$tag" --draft --notes-file release-notes.md main.js manifest.json styles.css
